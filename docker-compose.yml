services:
  postgres:
    image: postgres:16-alpine
    container_name: riyada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: riyada
      POSTGRES_PASSWORD: riyada_dev_password
      POSTGRES_DB: riyada
    ports:
      - "5432:5432"
    volumes:
      - riyada_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riyada -d riyada"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  riyada_pg_data:
