name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production API URL ending in /api
        required: true
        default: https://sports-x7v7.onrender.com/api
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.29.3'

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Check release secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PRODUCTION_DEFINES_BASE64: ${{ secrets.MOBILE_PRODUCTION_DEFINES_BASE64 }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "::error::ANDROID_KEYSTORE_BASE64 is required."; exit 1; }
          [[ -n "$KEY_ALIAS" ]] || { echo "::error::ANDROID_KEY_ALIAS is required."; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { echo "::error::ANDROID_KEY_PASSWORD is required."; exit 1; }
          [[ -n "$STORE_PASSWORD" ]] || { echo "::error::ANDROID_STORE_PASSWORD is required."; exit 1; }
          [[ -n "$PRODUCTION_DEFINES_BASE64" ]] || { echo "::error::MOBILE_PRODUCTION_DEFINES_BASE64 is required."; exit 1; }
      - name: Configure signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties
      - name: Configure production defines
        shell: bash
        env:
          PRODUCTION_DEFINES_BASE64: ${{ secrets.MOBILE_PRODUCTION_DEFINES_BASE64 }}
        run: |
          mkdir -p config
          printf '%s' "$PRODUCTION_DEFINES_BASE64" | base64 --decode > config/env.prod.json
      - name: Validate release configuration
        shell: pwsh
        run: ./scripts/validate_release_config.ps1 -RequireFirebase -RequireSigning -DartDefineFile config/env.prod.json
      - name: Build signed app bundle
        shell: bash
        env:
          DISPATCH_API_URL: ${{ inputs.api_base_url }}
          REPOSITORY_API_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: |
          API_URL="${DISPATCH_API_URL:-${REPOSITORY_API_URL:-https://sports-x7v7.onrender.com/api}}"
          flutter pub get --enforce-lockfile
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define-from-file=config/env.prod.json \
            --dart-define=API_BASE_URL="$API_URL" \
            --dart-define=ELECTRONIC_PAYMENTS_ENABLED=false
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/release.jks config/env.prod.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: android-obfuscation-symbols
          path: mobile/build/app/outputs/symbols/
          if-no-files-found: error
          retention-days: 90
