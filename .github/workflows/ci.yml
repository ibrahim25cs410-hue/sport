name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20.19.4'
  FLUTTER_VERSION: '3.29.3'

jobs:
  backend:
    name: Root backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB replica set
        run: |
          docker run --detach --name mongo-rs --publish 27017:27017 mongo:7 \
            --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-rs mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in {1..30}; do
            if docker exec mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check server.js
          node --check admin-backend.js
          node --check backend/mongo-models.js
          node --check backend/security.js
          node --check backend/invitations.js
          node --check scripts/migrate-production-data.js
          node --check tests/admin-backend-smoke.js
          node --check scripts/copy-admin.js
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Backend smoke and coverage
        run: npx --yes c8@10.1.3 --reporter=text --reporter=lcov --reporter=json-summary npm test
        env:
          ELECTRONIC_PAYMENTS_ENABLED: 'false'
      - name: MongoDB transaction and concurrency integration
        run: npm run test:mongo-integration
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - name: Migration apply and rollback
        run: |
          npm run migrate:dry-run
          npm run migrate:apply
          npm run migrate:rollback
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/riyada_ci?replicaSet=rs0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  web-admin:
    name: Admin web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
        env:
          VITE_ELECTRONIC_PAYMENTS_ENABLED: 'false'
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-admin-coverage
          path: web-admin/coverage/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: web-admin-dist
          path: web-admin/dist/
          retention-days: 14

  web:
    name: Customer web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
        env:
          VITE_ELECTRONIC_PAYMENTS_ENABLED: 'false'
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: web/coverage/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 14

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  release-config:
    name: Production configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate release and recovery tooling
        run: |
          node scripts/ops/validate-release-config.mjs
          bash -n scripts/ops/mongodb-backup.sh
          bash -n scripts/ops/mongodb-restore.sh
          bash scripts/ops/mongodb-backup.sh --dry-run
          bash scripts/ops/mongodb-restore.sh --backup /tmp/example.enc

  security:
    name: Repository security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
