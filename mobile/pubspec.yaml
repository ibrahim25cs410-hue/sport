name: riyada
description: Riyada - sports field booking app (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  crypto: ^3.0.6
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  signalr_netcore: ^1.4.0
  go_router: ^14.6.2
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.0
  google_sign_in: ^6.2.2
  # Maps & media
  geolocator: ^13.0.2
  cached_network_image: ^3.4.1
  # UI extras
  qr_flutter: ^4.1.0
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  line_icons: ^2.0.3
  flutter_svg: ^2.0.17
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flame: ^1.22.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#0B1E36"
  image: assets/images/app_icon.png
  android_12:
    color: "#0B1E36"
    image: assets/images/app_icon.png
  ios: true
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0B1E36"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/brand/
    - assets/icons/nav/
    - assets/logo/
    - assets/games/penalty_flame/
